name: Deploy magnetic modeling dashboard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magnetic-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run numerical tests
        run: python -m pytest -q
      - name: Stage the static site
        run: |
          python web/build_site.py "$RUNNER_TEMP/magnetic-site"
          test -s "$RUNNER_TEMP/magnetic-site/index.html"
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/magnetic-site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
